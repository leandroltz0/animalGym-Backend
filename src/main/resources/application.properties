spring.application.name=animal-gym-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/animalgym
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=0a5b3c8d1e2f4a7b9c0d3e5f8a2b4c6d7e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8
app.jwt.expiration=86400000

# Cloudinary
app.cloudinary.cloud-name=your-cloud-name
app.cloudinary.api-key=your-api-key
app.cloudinary.api-secret=your-api-secret

# Server
server.port=8080
