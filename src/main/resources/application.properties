spring.application.name=animal-gym-api

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:animalgym-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:0a5b3c8d1e2f4a7b9c0d3e5f8a2b4c6d7e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a1b2c3d4e5f6a7b8c9d0}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# Cloudinary
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}

# Frontend URLs (for CORS)
app.frontend.url.dev=${FRONTEND_URL_DEV:http://localhost:5173}
app.frontend.url.prod=${FRONTEND_URL_PROD:http://localhost:3000}

# Server
server.port=${SERVER_PORT:8080}

# Base URL for serving static files (used to build image URLs)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
